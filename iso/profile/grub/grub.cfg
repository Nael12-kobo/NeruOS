# NeruOS Nebula Edition — native GRUB menu
# This configuration is shared by x86_64 UEFI GRUB on the live ISO.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ext2
insmod png
insmod font
insmod gfxterm
insmod gfxmenu
insmod all_video
insmod search
insmod search_fs_file
insmod search_fs_uuid
insmod linux
insmod halt
insmod reboot
insmod efifwsetup

set gfxmode=auto
set gfxpayload=keep
terminal_input console
terminal_output gfxterm

# ArchISO's embedded loader searches for the ISO volume before it loads
# this file, so $root points at the NeruOS ISO filesystem here.
if [ -z "$root" ]; then
    search --no-floppy --set=root --file /neru/x86_64/airootfs.sfs
fi

if [ -f ($root)/boot/grub/theme/fonts/neruos-bold-32.pf2 ]; then
    loadfont ($root)/boot/grub/theme/fonts/neruos-bold-32.pf2
    loadfont ($root)/boot/grub/theme/fonts/neruos-regular-20.pf2
    loadfont ($root)/boot/grub/theme/fonts/neruos-regular-14.pf2
fi

if [ -f ($root)/boot/grub/theme/theme.txt ]; then
    set theme=($root)/boot/grub/theme/theme.txt
    export theme
fi

set default=neruos
set timeout=5
set timeout_style=menu

menuentry "Boot NeruOS" --class neruos --class gnu-linux --class os --id neruos {
    set gfxpayload=keep
    linux /neru/boot/%ARCH%/vmlinuz-linux archisobasedir=neru archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /neru/boot/%ARCH%/initramfs-linux.img
}

submenu "Advanced Options" --class advanced --id advanced {
    menuentry "Recovery Mode (text console)" --class recovery {
        set gfxpayload=keep
        linux /neru/boot/%ARCH%/vmlinuz-linux archisobasedir=neru archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% systemd.unit=multi-user.target
        initrd /neru/boot/%ARCH%/initramfs-linux.img
    }

    menuentry "Boot with minimal graphics" --class recovery {
        set gfxpayload=1024x768
        linux /neru/boot/%ARCH%/vmlinuz-linux archisobasedir=neru archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nomodeset
        initrd /neru/boot/%ARCH%/initramfs-linux.img
    }

    menuentry "Restart Computer" --class reboot {
        reboot
    }

    if [ "$grub_platform" = "efi" ]; then
        menuentry "UEFI Firmware Settings" --class efi {
            fwsetup
        }
    fi
}

menuentry "Power Off" --class shutdown --class poweroff --id poweroff {
    halt
}
