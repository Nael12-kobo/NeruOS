# NeruOS Nebula Edition — Legacy BIOS menu
UI vesamenu.c32
MENU TITLE NeruOS Nebula Edition
MENU BACKGROUND splash.png
MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 6
MENU VSHIFT 10
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 16
MENU HELPMSGENDROW 29

MENU COLOR border       30;44   #308894b7 #90070d1b std
MENU COLOR title        1;36;44 #e0e9f0ff #90070d1b std
MENU COLOR sel          7;37;40 #ffffffff #a0344c91 all
MENU COLOR unsel        37;44   #d0d9e5f8 #90070d1b std
MENU COLOR help         37;40   #b0c3cce0 #90070d1b std
MENU COLOR timeout_msg  37;40   #90c3cce0 #00000000 std
MENU COLOR timeout      1;37;40 #d0ffffff #00000000 std
MENU CLEAR

DEFAULT neruos
PROMPT 0
TIMEOUT 50

LABEL neruos
MENU LABEL Boot NeruOS
TEXT HELP
Start the NeruOS Nebula live environment.
ENDTEXT
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL recovery
MENU LABEL Recovery Mode (text console)
TEXT HELP
Start NeruOS without the graphical desktop session.
ENDTEXT
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% systemd.unit=multi-user.target

LABEL reboot
MENU LABEL Restart Computer
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32
